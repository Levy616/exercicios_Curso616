    <section id="cadastro" class="card">
      <h2>Cadastro de produtos</h2>
      <p class="nota">Protótipo: os dados ainda não são cadastrados. O CRUD será desenvolvido na Aula 12.</p>
      <form id="form_produto">
        <div class="form-grid">
          <div class="campo"><label for="codigo">Código</label><input id="codigo" name="codigo" type="number" min="1" step="1" required></div>
          <div class="campo"><label for="nome">Nome</label><input id="nome" name="nome" type="text" maxlength="100" required></div>
          <div class="campo"><label for="preco">Preço (R$)</label><input id="preco" name="preco" type="number" min="0" step="0.01" required></div>
          <div class="campo"><label for="quantidade">Quantidade</label><input id="quantidade" name="quantidade" type="number" min="0" step="1" required></div>
          <div class="campo largura-total"><label for="categoria">Categoria</label><select id="categoria" name="categoria" required><option value="">Selecione uma categoria</option><option value="periferico">Periférico</option><option value="monitor">Monitor</option><option value="acessorio">Acessório</option></select></div>
        </div>
        <div class="acoes">
          <button class="botao" type="submit" disabled title="Disponível na Aula 12">Cadastrar — Aula 12</button>
          <button class="botao botao-secundario" type="reset">Limpar</button>
        </div>
      </form>
    </section>
