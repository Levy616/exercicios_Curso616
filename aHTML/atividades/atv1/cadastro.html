<h1>Area de Cadastro</h1>

<a href="05atividade.html">Voltar ao inicio</a>

<h3>Dados Básicos</h3>
<ol>
    <li>nome do produto</li>
    <li>preço do produto</li>
    <li>categoria do produto</li>
    <li>descrição do produto</li>
</ol>

<h2>Aqui você irá cadastrar seus produtos de forma simple e rapida.</h2>


<label for="nome">Nome do produto</label>
<input type="text" id="nome" name="nome" required>
<p></p>
<label for="preco">Preço</label>
<input type="number" id="preco" name="preco" min="0" step="0.01" required>
<p></p>

<label for="categoria">Categoria</label>
<select id="categoria" name="categoria" required>
    <option value="">Selecione</option>
    <option value="periferico">Periférico</option>
    <option value="monitor">Monitor</option>
    <option value="acessorio">Acessório</option>
    <!-- <option value="cargo">agressor</option> -->
</select>

<p></p>
<label for="descricao">Descrição</label>
<textarea id="descricao" name="descricao" rows="3"></textarea>
<p></p>
<button type="submit">Cadastrar</button>
<button type="reset">Limpar</button>

</html>
